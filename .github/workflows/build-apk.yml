name: Build Material You Standalone APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to run the build manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Standalone Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-material-you-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
