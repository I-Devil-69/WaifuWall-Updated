name: Build and Release Material You APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate Dynamic Version Tag
        id: tag
        run: echo "version_tag=v$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version_tag }}
          name: "Material You Build - ${{ steps.tag.outputs.version_tag }}"
          body: "Automated standalone APK build"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version_tag }}
          name: "Material You Build - ${{ steps.tag.outputs.version_tag }}"
          body: "Automated standalone APK build compiled directly from Google AI Studio source files."
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
